name: 🚀 Next.js SSR LIVE

on: [workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with: { node-version: '18' }
    
    - run: npm ci
    - run: npm run build
    
    - name: 🚀 Start Next.js + ngrok
      run: |
        npm start &
        npx ngrok@5 http 3000 --authtoken=${{ secrets.NGROK_TOKEN }}
